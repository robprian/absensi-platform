# =====================================================================
# Deploy — Absensi & Payroll Platform → SG VPS (43.156.82.52)
# Fail-closed: HANYA jalan bila workflow Images sukses untuk ref yang sama.
# SSH memakai Deploy Key dari GitHub Secrets (bukan password):
#   VPS_HOST, VPS_PORT, VPS_USER, VPS_SSH_KEY
# VPS menarik image dari GHCR lalu `docker compose up -d`.
# =====================================================================

name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref yang di-deploy (branch / tag)"
        required: true
        default: "main"

jobs:
  check-images:
    name: Require images hijau
    runs-on: ubuntu-latest
    steps:
      - name: Pastikan workflow Images sukses untuk ref ini
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          conclusion="$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/images.yml/runs?per_page=1&status=completed&branch=$REF" \
            | jq -r '.workflow_runs[0].conclusion // "none"')"
          echo "Images conclusion untuk ref '$REF': $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Images belum hijau untuk ref '$REF' (status: $conclusion). Deploy dibatalkan."
            exit 1
          fi
          echo "Images hijau -> deploy diizinkan."

  deploy:
    name: Deploy ke SG VPS
    needs: check-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            # First-time setup: clone repo bila belum ada.
            if [ ! -d /home/robby/absensi-platform ]; then
              echo "== Clone repo (first deploy) =="
              git clone https://github.com/robprian/absensi-platform.git /home/robby/absensi-platform
            fi
            cd /home/robby/absensi-platform
            git pull --ff-only || echo "git pull gagal — lanjut"
            if [ ! -f .env ]; then
              echo "::error::File .env belum ada di VPS. Buat .env produksi dulu (lihat .env.example), lalu re-run deploy."
              exit 1
            fi
            echo "== Backup sebelum deploy =="
            ./scripts/backup.sh || echo "backup gagal — lanjut dengan hati-hati"
            echo "== Tarik image terbaru =="
            docker compose pull
            echo "== Jalankan stack =="
            docker compose up -d
            echo "== Tunggu sehat =="
            sleep 20
            docker compose ps
            echo "== Smoke test =="
            curl -sf https://hadir.seperti.my.id/api/health
            curl -sf https://data.seperti.my.id/api/health
            echo "DEPLOY OK"
