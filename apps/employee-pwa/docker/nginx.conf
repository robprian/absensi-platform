# nginx untuk Employee PWA (static SvelteKit). Dipakai di dalam container
# employee-pwa; TLS + security header di-terminasi di Caddy (reverse-proxy).
# File ini milik INFRA (jangan dihapus saat scaffolding ulang frontend).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kompresi untuk koneksi lapangan yang lambat.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Liveness probe untuk Docker healthcheck.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Aset berversi (hash di nama file, hasil build SvelteKit): cache lama.
    location ~* \.(?:js|css|png|jpg|jpeg|webp|avif|svg|ico|woff2?|ttf|eot|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker & manifest: JANGAN di-cache agresif agar update
    # PWA selalu terdeteksi.
    location ~* /(service-worker\.js|manifest\.webmanifest)$ {
        expires 0;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback. index.html tidak di-cache agar versi baru langsung aktif.
    location / {
        expires 0;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
