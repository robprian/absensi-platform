; Tuning PHP untuk Absensi Platform (default aman untuk produksi).
; File ini milik INFRA.
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60
max_input_time = 60
date.timezone = Asia/Jakarta
expose_php = Off

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Di container, kode hanya berubah lewat image baru, jadi validasi timestamp
; boleh longgar demi performa.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
